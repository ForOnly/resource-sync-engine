# Resource Sync Engine — Configuration
#
# Each entry under "resources" describes a single resource to
# synchronize. The sync engine will:
#   1. Download the resource from the given URL.
#   2. If the local file does not exist, create it.
#   3. If the local file exists, compare its hash.
#   4. If the hash differs, update the file.
#   5. If the hash matches, skip it.
#
# All ${VARIABLE} references are replaced with environment variables
# at runtime.

resources:
  # ──────────────────────────────────────────────
  # Example 1: A simple resource with default settings
  # ──────────────────────────────────────────────
  - name: "example-json"
    url: "https://example.com/data.json"
    path: "data/example.json"
    algorithm: "sha256"

  # ──────────────────────────────────────────────
  # Example 2: A resource with custom headers and env vars
  # ──────────────────────────────────────────────
  - name: "example-blocklist"
    url: "https://cdn.example.com/blocklist.txt"
    path: "data/blocklist.txt"
    algorithm: "sha1"
    headers:
      Authorization: "Bearer ${API_TOKEN}"
    timeout: 60
    retry: 5

  # ──────────────────────────────────────────────
  # Example 3: A large resource with a size limit
  # ──────────────────────────────────────────────
  - name: "geoip-database"
    url: "https://cdn.example.com/geoip.mmdb"
    path: "data/geoip.mmdb"
    algorithm: "md5"
    max_size: 104857600  # 100 MB

  # ──────────────────────────────────────────────
  # Example 4: Resource with custom output directory via env var
  # ──────────────────────────────────────────────
  - name: "custom-output"
    url: "https://example.com/config.ini"
    path: "${OUTPUT_DIR}/config.ini"
    algorithm: "sha256"
    timeout: 30
    retry: 3

# ──────────────────────────────────────────────
# Engine configuration (optional)
# ──────────────────────────────────────────────
#
# engine:
#   # Max concurrency for parallel downloads (default: 1)
#   max_concurrency: 4
#
#   # Sink type — "local" (default) or "git"
#   sink: local
#
#   # ── Event observers ─────────────────────
#   # Register observers to receive notifications about sync events.
#   # Supports two types: "log" (built-in) and "webhook".
#   #
#   # The "webhook" observer supports pluggable platforms (DingTalk,
#   # WeChat Work, Slack, Generic). Each platform is a separate plugin
#   # that handles its own message format and signing logic.
#   #
#   # All string values support ${ENV_VAR} substitution, making them
#   # compatible with GitHub Actions secrets:
#   #
#   #   url: "${WEBHOOK_URL}"
#   #   secret: "${WEBHOOK_SECRET}"
#   #
#   # observers:
#   #   - type: webhook
#   #     platform: dingtalk                  # dingtalk, wechat_work, slack, or generic
#   #     url: "${DINGTALK_WEBHOOK_URL}"      # Webhook URL (supports env vars)
#   #     secret: "${DINGTALK_SECRET}"        # Optional: HMAC-SHA256 signing secret
#   #     events:                             # Optional: event filter (default: all)
#   #       - SyncCompleted
#   #       - ResourceFailed
#   #
#   #   - type: webhook
#   #     platform: slack
#   #     url: "${SLACK_WEBHOOK_URL}"
#   #     events:
#   #       - SyncCompleted
#   #
#   #   - type: webhook
#   #     platform: wechat_work
#   #     url: "${WECHAT_WEBHOOK_URL}"
#   #
#   #   - type: webhook
#   #     platform: generic
#   #     url: "https://example.com/hooks/sync"
#   #     secret: "${WEBHOOK_SECRET}"