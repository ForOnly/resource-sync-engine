[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resource-sync-engine"
version = "2.0.0"
description = "Config-driven resource synchronization system — stream-based, plugin-oriented"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-httpx>=0.30", "pytest-asyncio>=0.23", "mypy>=1.8", "ruff>=0.3"]

[project.scripts]
resource-sync = "resource_sync.cli.app:main"

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]