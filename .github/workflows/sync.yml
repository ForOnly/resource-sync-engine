# Resource Sync Engine — GitHub Actions workflow
#
# Runs every 6 hours on a schedule. Supports manual trigger via
# workflow_dispatch. Automatically commits and pushes any resource
# changes. If no resources changed, no commit is made.
#
# Required secrets:
#   - None by default. If your config references ${TOKEN} or similar
#     env vars, add them as GitHub Actions secrets and pass them below.
#
# Webhook notification secrets (if using webhook observers):
#   - DINGTALK_WEBHOOK_URL: DingTalk robot webhook URL
#   - DINGTALK_SECRET:      DingTalk HMAC-SHA256 signing secret
#   - SLACK_WEBHOOK_URL:    Slack Incoming Webhook URL
#   - WECHAT_WEBHOOK_URL:   WeChat Work robot webhook URL
#   - WEBHOOK_SECRET:       Generic webhook signing secret
#
# See config.yaml for the corresponding observer configuration.

name: Resource Sync

on:
  schedule:
    # Every 6 hours at minute 0
    - cron: "0 18 * * *"
  workflow_dispatch:
  # Allow manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    name: Sync Resources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run resource sync
        run: python -m resource_sync -c config.yaml
        env:
          # Add your custom environment variables here:
          # API_TOKEN: ${{ secrets.API_TOKEN }}
          # HOST: ${{ secrets.HOST }}
          # OUTPUT_DIR: ${{ secrets.OUTPUT_DIR }}

          # Webhook notification environment variables (uncomment if using webhook observers):
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          # SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          # WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}

          GITHUB_ACTIONS: "true"